<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Breakdown Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b08;
      --panel-bg: rgba(8, 26, 17, 0.85);
      --card-bg: #0b2216;
      --card-border: #134e2e;
      --card-hover: #103822;
      --halo-green: #00ff66;
      --halo-glow: rgba(0, 255, 102, 0.35);
      --halo-glow-subtle: rgba(0, 255, 102, 0.12);
      --accent-emerald: #02381e;
      --text-main: #f0fdf4;
      --text-muted: #62997b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Custom Halo Green Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--halo-green); box-shadow: 0 0 10px var(--halo-green); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 102, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(0, 204, 82, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8), 0 1px 0 var(--halo-glow-subtle);
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      background: linear-gradient(135deg, var(--halo-green), #00993d);
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px var(--halo-glow);
    }
    header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--halo-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 10px var(--halo-glow-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-clock::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: var(--halo-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--halo-green);
    }

    .action-group { display: flex; gap: 12px; align-items: center; }

    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--halo-green), #00b347);
      color: #02140a;
      box-shadow: 0 0 18px var(--halo-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 255, 102, 0.6);
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--halo-green);
      box-shadow: 0 0 12px var(--halo-glow-subtle);
      transform: translateY(-1px);
    }

    /* Layout Structure */
    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* Left Control Sidebar */
    .left-panel {
      width: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--card-border);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .panel-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--halo-green);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--halo-glow);
    }

    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }

    .input-text {
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--halo-green);
      font-weight: 700;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-text:focus {
      border-color: var(--halo-green);
      box-shadow: 0 0 15px var(--halo-glow);
    }

    .format-card {
      background: linear-gradient(180deg, var(--card-bg), rgba(11, 34, 22, 0.4));
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 12px;
      color: var(--text-muted);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .format-card code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 16px;
      border-radius: 8px;
      border: 1px solid var(--halo-green);
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 0 10px var(--halo-glow);
    }

    .textarea-wrapper { position: relative; display: flex; flex-direction: column; }
    textarea {
      width: 100%;
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: #b3ffcb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 18px;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
      line-height: 1.65;
    }
    textarea#dataInput { height: 260px; }
    textarea#notesInput { height: 90px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; }
    
    textarea:focus {
      border-color: var(--halo-green);
      box-shadow: 0 0 15px var(--halo-glow);
    }

    .status-badge {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: var(--card-bg);
      border: 1px solid var(--halo-green);
      font-size: 11px;
      font-weight: 700;
      color: var(--halo-green);
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--halo-glow);
    }

    /* Right Preview Container */
    .right-panel {
      flex: 1;
      background: transparent;
      padding: 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Dashboard Metrics Bar */
    .dashboard-metrics {
      width: 100%;
      max-width: 840px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .metric-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .metric-card:hover { 
      transform: translateY(-3px); 
      border-color: var(--halo-green);
      box-shadow: 0 0 20px var(--halo-glow-subtle);
    }
    .metric-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 28px; font-weight: 800; color: var(--halo-green); letter-spacing: -0.5px; text-shadow: 0 0 10px var(--halo-glow); }

    /* Printable Paper Output */
    .report-paper {
      background: #ffffff;
      color: #111827;
      width: 100%;
      max-width: 840px;
      padding: 48px 52px;
      border-radius: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 2px var(--halo-green);
      font-size: 11px;
      position: relative;
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 3px solid var(--accent-emerald);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .delivery-no-box { font-size: 12px; font-weight: 800; color: var(--accent-emerald); text-transform: uppercase; }
    .doc-title h2 { font-size: 22px; font-weight: 900; color: var(--accent-emerald); letter-spacing: 0.5px; text-align: center; }
    .doc-logo-group { text-align: right; }
    .doc-logo { font-size: 28px; font-weight: 900; color: var(--accent-emerald); font-style: italic; letter-spacing: -1px; }
    .doc-timestamp { font-size: 9px; font-weight: 700; color: #4b5563; margin-top: 2px; text-transform: uppercase; }

    .summary-section { margin-top: 28px; page-break-inside: avoid; }
    .section-title { font-size: 12px; font-weight: 800; color: var(--accent-emerald); text-transform: uppercase; margin: 24px 0 10px 0; border-bottom: 2px solid var(--accent-emerald); padding-bottom: 4px; }

    /* Tables */
    table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 11px; page-break-inside: auto; }
    table.data-table tr { page-break-inside: avoid; page-break-after: auto; }
    table.data-table th, table.data-table td { border: 1px solid #e5e7eb; padding: 7px 12px; text-align: left; }
    table.data-table th { background: #e6fdf0; color: var(--accent-emerald); font-weight: 800; text-transform: uppercase; }
    table.data-table .num-col { text-align: right; }
    
    .subtotal-row { background-color: #f8fafc; font-weight: bold; color: var(--accent-emerald); }
    .grandtotal-row { background-color: var(--accent-emerald); color: #ffffff; font-weight: 900; font-size: 11.5px; }
    .grandtotal-row td { border-color: var(--accent-emerald); }

    /* Custom Footer Notes Styling */
    .custom-notes-box {
      margin-top: 20px;
      padding: 12px 14px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-left: 4px solid var(--accent-emerald);
      border-radius: 6px;
      font-size: 10.5px;
      color: #374151;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .custom-notes-title {
      font-weight: 800;
      color: var(--accent-emerald);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .doc-note { font-size: 10px; color: #6b7280; font-style: italic; margin-top: 14px; }

    /* Empty State */
    .empty-state {
      background: var(--panel-bg);
      border: 2px dashed var(--card-border);
      border-radius: 20px;
      padding: 80px 40px;
      text-align: center;
      color: var(--text-muted);
      max-width: 520px;
      margin-top: 40px;
    }
    .empty-state-icon { font-size: 44px; margin-bottom: 12px; display: inline-block; }

    /* Print Overrides */
    @media print {
      header, .left-panel, .dashboard-metrics, .no-print { display: none !important; }
      body, .app-body, .right-panel { background: #ffffff !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; display: block !important; }
      .report-paper { box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; width: 100% !important; max-width: 100% !important; }
      .data-table th { background-color: #e6fdf0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .grandtotal-row { background-color: #02381e !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .custom-notes-box { background-color: #f9fafb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <h1>Lyka Breakdown Generator</h1>
    </div>
    <div class="action-group">
      <div class="live-clock" id="liveClock">--:--:--</div>
      <button class="btn btn-secondary" onclick="copyData()">📋 Copy Input</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print Docket (A4)</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Panel Controls -->
    <div class="left-panel">
      <div class="panel-header">
        <span class="panel-title">Input</span>
        <div>
          <button class="btn btn-secondary" style="padding:6px 12px; font-size:11px;" onclick="loadSample()">Sample</button>
          <button class="btn btn-secondary" style="padding:6px 12px; font-size:11px;" onclick="clearData()">Clear</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="deliveryNoInput">Delivery Reference No.</label>
        <input type="text" id="deliveryNoInput" class="input-text" placeholder="TOLN___" oninput="parseData()">
      </div>

      <div class="format-card">
        <span class="field-label">Accepted Delimiter:</span>
        <code>-</code>
      </div>

      <div class="field-group">
        <label class="field-label">Raw Breakdown Stream</label>
        <div class="textarea-wrapper">
          <textarea id="dataInput" placeholder="Beef lung&#10;344-455-222-989&#10;&#10;Beef trim&#10;459-345-290&#10;&#10;Beef kidney&#10;412-380-510" oninput="parseData()"></textarea>
          <div class="status-badge" id="palletCountBadge">0 Pallets</div>
        </div>
      </div>

      <!-- New Custom Notes Input Box -->
      <div class="field-group">
        <label class="field-label" for="notesInput">Additional Notes / Instructions (Optional)</label>
        <textarea id="notesInput" placeholder="e.g. Temperature checked on arrival: -18°C. Driver signature required." oninput="parseData()"></textarea>
      </div>
    </div>

    <!-- Right Live Document View -->
    <div class="right-panel">
      
      <!-- Live Metrics Header -->
      <div class="dashboard-metrics" id="dashboardMetrics" style="display:none;">
        <div class="metric-card">
          <span class="metric-label">Total Pallets</span>
          <span class="metric-value" id="statPallets">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Gross Weight</span>
          <span class="metric-value" id="statWeight">0 kg</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Unique Products</span>
          <span class="metric-value" id="statProducts">0</span>
        </div>
      </div>

      <!-- Report Sheet Output -->
      <div id="reportContainer" style="width: 100%; display: flex; justify-content: center;">
        <div class="empty-state">
          <div class="empty-state-icon">📄</div>
          <strong style="color:var(--text-main); display:block; font-size:17px;">Awaiting Input Data</strong>
          <p style="margin-top:8px; font-size:13px;">Enter product names and weights on the left, or click <strong>Sample</strong>.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Live Clock Function
    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('liveClock').innerText = `${dateStr} • ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const sampleText = `Beef lung
344-455-222-989

Beef heart
864-864-864-864-864-900-897

Beef trim
459-345-290-979-788-610

Beef kidney
412-380-510-495

Sardines
560-560-560-448-448`;

    // Helper to format numbers cleanly (hides .0 for whole integers)
    function formatNum(val) {
      if (typeof val !== 'number') val = parseFloat(val);
      if (isNaN(val)) return '0';
      return Number.isInteger(val) ? val.toLocaleString() : val.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 2 });
    }

    function loadSample() {
      document.getElementById('deliveryNoInput').value = 'TOLN10492';
      document.getElementById('dataInput').value = sampleText;
      document.getElementById('notesInput').value = 'All pallets verified and temp logged at -18°C. Bay 3 dispatch.';
      parseData();
    }

    function clearData() {
      document.getElementById('deliveryNoInput').value = '';
      document.getElementById('dataInput').value = '';
      document.getElementById('notesInput').value = '';
      parseData();
    }

    function copyData() {
      const input = document.getElementById('dataInput').value;
      if (!input) return;
      navigator.clipboard.writeText(input);
      alert('Raw input copied to clipboard!');
    }

    // Strictly extracts weights split by dashes (-) only
    function extractWeightsFromLine(line) {
      const weights = [];
      const parts = line.split('-');

      parts.forEach(part => {
        const cleanPart = part.trim();
        const weightVal = parseFloat(cleanPart);
        if (!isNaN(weightVal) && weightVal > 0) {
          weights.push(weightVal);
        }
      });

      return weights;
    }

    function parseData() {
      const deliveryNo = document.getElementById('deliveryNoInput').value.trim();
      const rawText = document.getElementById('dataInput').value.trim();
      const customNotes = document.getElementById('notesInput').value.trim();
      const container = document.getElementById('reportContainer');
      const metrics = document.getElementById('dashboardMetrics');
      const badge = document.getElementById('palletCountBadge');

      if (!rawText) {
        metrics.style.display = 'none';
        badge.innerText = '0 Pallets';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📄</div>
            <strong style="color:var(--text-main); display:block; font-size:17px;">Awaiting Input Data</strong>
            <p style="margin-top:8px; font-size:13px;">Enter product names and weights on the left, or click <strong>Sample</strong>.</p>
          </div>`;
        return;
      }

      const lines = rawText.split('\n');
      const pallets = [];
      let palletCounter = 1;
      let currentDesc = '';

      lines.forEach(line => {
        let cleanLine = line.trim();
        if (!cleanLine) return;

        const hasText = /[a-zA-Z]/.test(cleanLine);

        if (hasText) {
          // Detect if text and dash-separated numbers are on the same line
          const firstNumIdx = cleanLine.search(/\d/);
          if (firstNumIdx !== -1) {
            currentDesc = cleanLine.substring(0, firstNumIdx).replace(/[-,\s]+$/, '').trim();
            const weights = extractWeightsFromLine(cleanLine.substring(firstNumIdx));
            weights.forEach(w => {
              pallets.push({ palletNo: palletCounter++, desc: currentDesc.toUpperCase(), weight: w });
            });
          } else {
            currentDesc = cleanLine;
          }
        } else if (currentDesc) {
          // Strictly parse dash-separated weights on dedicated lines
          const weights = extractWeightsFromLine(cleanLine);
          weights.forEach(w => {
            pallets.push({ palletNo: palletCounter++, desc: currentDesc.toUpperCase(), weight: w });
          });
        }
      });

      badge.innerText = `${pallets.length} Pallet${pallets.length === 1 ? '' : 's'}`;

      if (pallets.length === 0) {
        metrics.style.display = 'none';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <strong style="color:var(--text-main); display:block; font-size:17px;">No Valid Weights Detected</strong>
            <p style="margin-top:8px; font-size:13px;">Ensure weights are separated by hyphens (e.g., 459-345-290).</p>
          </div>`;
        return;
      }

      const summaryGroups = {};
      let totalPalletsCount = 0;
      let grandTotalWeight = 0;

      pallets.forEach(item => {
        totalPalletsCount++;
        grandTotalWeight += item.weight;

        if (!summaryGroups[item.desc]) {
          summaryGroups[item.desc] = { weights: {}, totalWeight: 0, totalPallets: 0 };
        }

        const group = summaryGroups[item.desc];
        const wKey = item.weight.toString();
        
        if (!group.weights[wKey]) {
          group.weights[wKey] = 0;
        }
        group.weights[wKey]++;
        group.totalPallets++;
        group.totalWeight += item.weight;
      });

      // Update Header Stats Bar
      metrics.style.display = 'grid';
      document.getElementById('statPallets').innerText = totalPalletsCount;
      document.getElementById('statWeight').innerText = `${formatNum(grandTotalWeight)} kg`;
      document.getElementById('statProducts').innerText = Object.keys(summaryGroups).length;

      // Current Timestamp formatting for the generated document
      const now = new Date();
      const generatedStamp = `${now.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })} @ ${now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;

      let html = `
        <div class="report-paper">
          <div class="doc-header">
            <div class="delivery-no-box" style="width:30%;">
              ${deliveryNo ? `DELIVERY NO: ${deliveryNo}` : ''}
            </div>
            <div class="doc-title" style="width:40%;">
              <h2>DELIVERY BREAKDOWN</h2>
            </div>
            <div class="doc-logo-group" style="width:30%;">
              <div class="doc-logo">lyka</div>
              <div class="doc-timestamp">GENERATED: ${generatedStamp}</div>
            </div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 15%;">PALLET NO.</th>
                <th style="width: 60%;">PRODUCT DESCRIPTION</th>
                <th style="width: 25%;" class="num-col">WEIGHT (KG)</th>
              </tr>
            </thead>
            <tbody>
              ${pallets.map(p => `
                <tr>
                  <td>${p.palletNo}</td>
                  <td><strong>${p.desc}</strong></td>
                  <td class="num-col"><strong>${formatNum(p.weight)}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="summary-section">
            <div class="section-title">DELIVERY SUMMARY</div>
            <div style="font-weight: bold; font-size: 10.5px; margin-bottom: 6px; color: #374151;">PALLET QUANTITY BREAKDOWN BY WEIGHT</div>

            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 40%;">PRODUCT</th>
                  <th style="width: 20%;" class="num-col">WEIGHT PER PALLET (KG)</th>
                  <th style="width: 20%;" class="num-col">NO. OF PALLETS</th>
                  <th style="width: 20%;" class="num-col">TOTAL WEIGHT (KG)</th>
                </tr>
              </thead>
              <tbody>
      `;

      Object.keys(summaryGroups).forEach(prodName => {
        const group = summaryGroups[prodName];
        const weightsList = Object.keys(group.weights);

        weightsList.forEach((wVal, idx) => {
          const count = group.weights[wVal];
          const subWeight = parseFloat(wVal) * count;
          
          html += `
            <tr>
              <td>${idx === 0 ? `<strong>${prodName}</strong>` : ''}</td>
              <td class="num-col">${formatNum(wVal)}</td>
              <td class="num-col">${count}</td>
              <td class="num-col">${formatNum(subWeight)}</td>
            </tr>
          `;
        });

        html += `
          <tr class="subtotal-row">
            <td>TOTAL ${prodName}</td>
            <td class="num-col"></td>
            <td class="num-col">${group.totalPallets}</td>
            <td class="num-col">${formatNum(group.totalWeight)}</td>
          </tr>
        `;
      });

      html += `
              <tr class="grandtotal-row">
                <td>GRAND TOTAL</td>
                <td class="num-col"></td>
                <td class="num-col">${totalPalletsCount}</td>
                <td class="num-col">${formatNum(grandTotalWeight)}</td>
              </tr>
            </tbody>
          </table>

          ${customNotes ? `
            <div class="custom-notes-box">
              <div class="custom-notes-title">Delivery Notes:</div>
              <div>${customNotes}</div>
            </div>
          ` : ''}

          <div class="doc-note">
            Note: All weights are recorded in kilograms (kg). Generated on ${generatedStamp}.
          </div>
        </div>
      </div>
      `;

      container.innerHTML = html;
    }
  </script>
</body>
</html>
