<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Breakdown Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b08;
      --panel-bg: rgba(8, 26, 17, 0.85);
      --card-bg: #0b2216;
      --card-border: #134e2e;
      --card-hover: #103822;
      --halo-green: #00ff66;
      --halo-glow: rgba(0, 255, 102, 0.35);
      --halo-glow-subtle: rgba(0, 255, 102, 0.12);
      --accent-emerald: #02381e;
      --text-main: #f0fdf4;
      --text-muted: #62997b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--halo-green); box-shadow: 0 0 10px var(--halo-green); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 102, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(0, 204, 82, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8), 0 1px 0 var(--halo-glow-subtle);
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      background: linear-gradient(135deg, var(--halo-green), #00993d);
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--halo-glow);
    }
    .brand-icon svg { width: 24px; height: 24px; fill: #02140a; }

    header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--halo-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 10px var(--halo-glow-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-clock::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: var(--halo-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--halo-green);
    }

    .action-group { display: flex; gap: 12px; align-items: center; }

    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--halo-green), #00b347);
      color: #02140a;
      box-shadow: 0 0 18px var(--halo-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 255, 102, 0.6);
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--halo-green);
      box-shadow: 0 0 12px var(--halo-glow-subtle);
      transform: translateY(-1px);
    }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    .left-panel {
      width: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--card-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .panel-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--halo-green);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--halo-glow);
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field-group { flex: 1; }

    .field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }

    .input-text, .input-select {
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--halo-green);
      font-weight: 700;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }
    .input-text::placeholder { color: rgba(98, 153, 123, 0.4); font-weight: 500; }
    .input-text:focus, .input-select:focus {
      border-color: var(--halo-green);
      box-shadow: 0 0 15px var(--halo-glow);
    }
    .input-select option {
      background: #050b08;
      color: #f0fdf4;
    }

    .format-card {
      background: linear-gradient(180deg, var(--card-bg), rgba(11, 34, 22, 0.4));
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .format-card code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 12px;
      border-radius: 6px;
      border: 1px solid var(--halo-green);
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 0 8px var(--halo-glow);
    }

    .textarea-wrapper { position: relative; display: flex; flex-direction: column; }
    textarea {
      width: 100%;
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #b3ffcb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
      line-height: 1.6;
    }
    textarea::placeholder { color: rgba(98, 153, 123, 0.4); font-weight: 500; }
    textarea#dataInput { height: 180px; }
    textarea#notesInput { height: 80px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; }
    
    textarea:focus {
      border-color: var(--halo-green);
      box-shadow: 0 0 15px var(--halo-glow);
    }

    .status-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--card-bg);
      border: 1px solid var(--halo-green);
      font-size: 11px;
      font-weight: 700;
      color: var(--halo-green);
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px var(--halo-glow);
    }

    .right-panel {
      flex: 1;
      background: transparent;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .dashboard-metrics {
      width: 100%;
      max-width: 840px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .metric-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .metric-info { display: flex; flex-direction: column; gap: 4px; }
    .metric-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--halo-green); text-shadow: 0 0 10px var(--halo-glow); }
    .metric-icon-box {
      width: 38px; height: 38px;
      border-radius: 8px;
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
    }
    .metric-icon-box svg { width: 20px; height: 20px; fill: var(--halo-green); }

    .report-paper {
      background: #ffffff;
      color: #111827;
      width: 100%;
      max-width: 840px;
      padding: 36px 44px;
      border-radius: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,0
