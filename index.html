<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Breakdown Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    :root {
      --bg-dark: #050b08;
      --panel-bg: rgba(8, 26, 17, 0.85);
      --card-bg: #0b2216;
      --card-border: #134e2e;
      --card-hover: #103822;
      --halo-green: #00ff66;
      --halo-glow: rgba(0, 255, 102, 0.35);
      --halo-glow-subtle: rgba(0, 255, 102, 0.12);
      --text-main: #f0fdf4;
      --text-muted: #62997b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--halo-green); box-shadow: 0 0 10px var(--halo-green); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 102, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(0, 204, 82, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8), 0 1px 0 var(--halo-glow-subtle);
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      background: linear-gradient(135deg, var(--halo-green), #00993d);
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--halo-glow);
    }
    .brand-icon svg { width: 24px; height: 24px; fill: #02140a; }

    header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--halo-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 10px var(--halo-glow-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-clock::before {
      content: '';
      width: 8px; height: 8px;
      background-color: var(--halo-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--halo-green);
    }

    .action-group { display: flex; gap: 12px; align-items: center; }

    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--halo-green), #00b347);
      color: #02140a;
      box-shadow: 0 0 18px var(--halo-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 255, 102, 0.6);
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--halo-green);
      box-shadow: 0 0 12px var(--halo-glow-subtle);
      transform: translateY(-1px);
    }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    .left-panel {
      width: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--card-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .panel-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--halo-green);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--halo-glow);
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field-group { flex: 1; }

    .field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }

    .input-text, .input-select {
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--halo-green);
      font-weight: 700;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }
    .input-text::placeholder { color: rgba(98, 153, 123, 0.4); font-weight: 500; }
    .input-text:focus, .input-select:focus {
      border-color: var(--halo-green);
      box-shadow: 0 0 15px var(--halo-glow);
    }
    .input-select option { background: #050b08; color: #f0fdf4; }

    .format-card {
      background: linear-gradient(180deg, var(--card-bg), rgba(11, 34, 22, 0.4));
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .format-card code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--halo-green);
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 12px;
      border-radius: 6px;
      border: 1px solid var(--halo-green);
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 0 8px var(--halo-glow);
    }

    .textarea-wrapper { position: relative; display: flex; flex-direction: column; }
    textarea {
      width: 100%;
      background: rgba(3, 15, 10, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #b3ffcb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
      line-height: 1.6;
    }
    textarea::placeholder { color: rgba(98, 153, 123, 0.4); font-weight: 500; }
    textarea#dataInput { height: 180px; }
    textarea#notesInput { height: 80px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; }
    textarea:focus { border-color: var(--halo-green); box-shadow: 0 0 15px var(--halo-glow); }

    .status-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--card-bg);
      border: 1px solid var(--halo-green);
      font-size: 11px;
      font-weight: 700;
      color: var(--halo-green);
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px var(--halo-glow);
    }

    .right-panel {
      flex: 1;
      background: transparent;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .dashboard-metrics {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .metric-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .metric-info { display: flex; flex-direction: column; gap: 4px; }
    .metric-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 24px; font-weight: 800; color: var(--halo-green); text-shadow: 0 0 10px var(--halo-glow); }
    .metric-icon-box {
      width: 38px; height: 38px;
      border-radius: 8px;
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
    }
    .metric-icon-box svg { width: 20px; height: 20px; fill: var(--halo-green); }

    .pdf-pages-wrapper {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      max-width: 800px;
      align-items: center;
    }

    /* Original PDF Styling matching Image 2 Layout */
    .doc-page {
      background: #ffffff;
      color: #111827;
      width: 794px;
      min-width: 794px;
      min-height: 1123px;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      position: relative;
      page-break-after: always;
      break-after: page;
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .header-col-left { display: flex; flex-direction: column; gap: 3px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; color: #111827; }
    .header-col-center { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #111827; letter-spacing: 0.5px; text-align: center; }
    .header-col-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .meta-pills-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid #166534;
      border-radius: 6px;
      overflow: hidden;
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      background: #f0fdf4;
    }
    .meta-pill-label { background: #dcfce7; color: #14532d; padding: 3px 6px; border-right: 1px solid #166534; }
    .meta-pill-val { padding: 3px 8px; color: #166534; text-align: center; min-width: 50px; }
    .meta-pill-val.fail, .meta-pill-val.no { color: #b91c1c; background: #fee2e2; }

    table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 9.5px; }
    table.data-table th, table.data-table td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: left; }
    table.data-table th { background: #f0fdf4; color: #14532d; font-weight: 800; text-transform: uppercase; border-color: #166534; }
    table.data-table .num-col { text-align: right; }
    
    .section-title {
      font-size: 10px;
      font-weight: 800;
      color: #111827;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtotal-row { background-color: #f9fafb; font-weight: 800; color: #111827; }
    .grandtotal-row { background-color: #111827; color: #ffffff; font-weight: 900; font-size: 10.5px; }
    .grandtotal-row td { border-color: #111827; color: #ffffff; text-align: right; }

    .custom-notes-box {
      margin-top: 10px;
      padding: 10px 12px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-left: 4px solid #111827;
      border-radius: 6px;
      font-size: 10px;
      color: #374151;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .custom-notes-title { font-weight: 800; color: #111827; text-transform: uppercase; font-size: 9.5px; margin-bottom: 4px; }

    .sign-off-box {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #111827;
      border-radius: 8px;
      background-color: #ffffff;
    }
    .sign-off-title { font-size: 10px; font-weight: 800; color: #111827; text-transform: uppercase; margin-bottom: 20px; }
    .sign-off-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; align-items: flex-end; }
    .sign-line { border-bottom: 1px solid #9ca3af; height: 16px; width: 100%; }
    .sign-label { font-size: 8.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-top: 4px; }

    .doc-footer-note { font-size: 8.5px; color: #6b7280; font-style: italic; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e5e7eb; padding-top: 6px; }

    .empty-state {
      background: var(--panel-bg);
      border: 2px dashed var(--card-border);
      border-radius: 20px;
      padding: 80px 40px;
      text-align: center;
      color: var(--text-muted);
      max-width: 520px;
      margin-top: 40px;
    }
    .empty-state-icon { margin-bottom: 16px; display: inline-block; }
    .empty-state-icon svg { width: 48px; height: 48px; fill: var(--text-muted); }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { background: #ffffff !important; margin: 0 !important; padding: 0 !important; height: 100% !important; overflow: visible !important; }
      header, .left-panel, .dashboard-metrics, .no-print { display: none !important; }
      .app-body, .right-panel, #reportContainer { display: block !important; padding: 0 !important; margin: 0 !important; width: 100% !important; background: #ffffff !important; overflow: visible !important; }
      .pdf-pages-wrapper { gap: 0 !important; max-width: 100% !important; width: 100% !important; }
      .doc-page { width: 100% !important; min-width: 100% !important; max-width: 100% !important; height: 100vh !important; min-height: 100vh !important; box-shadow: none !important; padding: 15mm 15mm !important; border-radius: 0 !important; box-sizing: border-box !important; page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important; break-inside: avoid !important; }
      .doc-page:last-child { page-break-after: auto !important; break-after: auto !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 11.5c-1.8 0-3.3 1.5-3.3 3.3 0 1.5 1.8 4.2 3.3 5.7 1.5-1.5 3.3-4.2 3.3-5.7 0-1.8-1.5-3.3-3.3-3.3zm-5.5-2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm11 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-11 4.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm11 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
      </div>
      <h1>Lyka Breakdown Generator</h1>
    </div>
    <div class="action-group">
      <div class="live-clock" id="liveClock">--:--:--</div>
      <button class="btn btn-secondary" onclick="copyData()">📋 Copy Input</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-primary" id="uploadSharepointBtn" onclick="sendEmail()">📧 Email Docket</button>
    </div>
  </header>

  <div class="app-body">
    <div class="left-panel">
      <div class="panel-header">
        <span class="panel-title">Header Information</span>
        <div>
          <button class="btn btn-secondary" style="padding:4px 10px; font-size:11px;" onclick="loadSample()">Sample</button>
          <button class="btn btn-secondary" style="padding:4px 10px; font-size:11px;" onclick="clearData()">Clear</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="deliveryNoInput">Delivery Ref No.</label>
          <input type="text" id="deliveryNoInput" class="input-text" placeholder="e.g. TOLN10492" oninput="parseData()">
        </div>
        <div class="field-group">
          <label class="field-label" for="supplierInput">Supplier Name</label>
          <input type="text" id="supplierInput" class="input-text" placeholder="e.g. Parwan Valley" oninput="parseData()">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="generatedByInput">Generated By (Your Name)</label>
        <input type="text" id="generatedByInput" class="input-text" placeholder="e.g. John Doe" oninput="parseData()">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="tempInput">Temp on Arrival</label>
          <input type="text" id="tempInput" class="input-text" placeholder="e.g. -18°C" oninput="parseData()">
        </div>
        <div class="field-group">
          <label class="field-label" for="primesafeInput">PrimeSafe No.</label>
          <input type="text" id="primesafeInput" class="input-text" placeholder="e.g. PS-10482" oninput="parseData()">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="pkgAcceptableInput">Packaging Acceptable</label>
        <select id="pkgAcceptableInput" class="input-select" onchange="parseData()">
          <option value="PASS" selected>PASS</option>
          <option value="FAIL">FAIL</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="hardFrozenInput">Product Hard Frozen</label>
        <select id="hardFrozenInput" class="input-select" onchange="parseData()">
          <option value="YES" selected>YES</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div class="format-card">
        <span class="field-label">Accepted Delimiter:</span>
        <code>-</code>
      </div>

      <div class="field-group">
        <label class="field-label">Raw Breakdown Stream</label>
        <div class="textarea-wrapper">
          <textarea id="dataInput" placeholder="Kangaroo trim&#10;952-979.2-979.2-979.2-979.2-979.2-979.2&#10;&#10;Kangaroo MDM&#10;432-432-612-612-720-720-720-720" oninput="parseData()"></textarea>
          <div class="status-badge" id="palletCountBadge">0 Pallets</div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="notesInput">Additional Notes / Instructions</label>
        <textarea id="notesInput" placeholder="Kangaroo trim BBD : 30/06/2028&#10;Kangaroo MDM BBD : 25/2/2029"></textarea>
      </div>
    </div>

    <div class="right-panel">
      <div class="dashboard-metrics" id="dashboardMetrics" style="display:none;">
        <div class="metric-card">
          <div class="metric-info">
            <span class="metric-label">Total Pallets</span>
            <span class="metric-value" id="statPallets">0</span>
          </div>
          <div class="metric-icon-box">
            <svg viewBox="0 0 24 24"><path d="M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H4V5h16v14zM6 7h12v2H6V7zm0 4h12v2H6v-2zm0 4h8v2H6v-2z"/></svg>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-info">
            <span class="metric-label">Gross Weight</span>
            <span class="metric-value" id="statWeight">0 kg</span>
          </div>
          <div class="metric-icon-box">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5 0 1.52-1 2.81-2.4 3.27L14.5 17h-2.1l-1.1-3.3H9.5L8.4 17H6.3l1.4-4.23C6.3 12.31 5.3 11.02 5.3 9.5 5.3 7.57 6.87 6 8.8 6h3.2zm0 2H8.8c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h3.2c.83 0 1.5-.67 1.5-1.5S12.83 8 12 8z"/></svg>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-info">
            <span class="metric-label">Unique Products</span>
            <span class="metric-value" id="statProducts">0</span>
          </div>
          <div class="metric-icon-box">
            <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
          </div>
        </div>
      </div>

      <div id="reportContainer" style="width: 100%; display: flex; justify-content: center;">
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          </div>
          <strong style="color:var(--text-main); display:block; font-size:17px;">Awaiting Input Data</strong>
          <p style="margin-top:8px; font-size:13px;">Enter product names and weights on the left, or click <strong>Sample</strong>.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      emailjs.init("I9OvU1KIHitB_S939");
    })();

    function updateClock() {
      const liveClockEl = document.getElementById('liveClock');
      if (!liveClockEl) return;
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      liveClockEl.innerText = `${dateStr} • ${timeStr}`;
    }
    setInterval(updateClock, 1000);

    const sampleText = `Kangaroo trim
952-979.2-979.2-979.2-979.2-979.2-979.2

Kangaroo MDM
432-432-612-612-720-720-720-720`;

    function formatNum(val) {
      if (typeof val !== 'number') val = parseFloat(val);
      if (isNaN(val)) return '0';
      return Number.isInteger(val) ? val.toLocaleString() : val.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 2 });
    }

    function loadSample() {
      document.getElementById('deliveryNoInput').value = 'TOLN10492';
      document.getElementById('supplierInput').value = 'PARWAN VALLEY MEATS';
      document.getElementById('generatedByInput').value = 'JOHN DOE';
      document.getElementById('tempInput').value = '-18°C';
      document.getElementById('primesafeInput').value = 'PS-10482';
      document.getElementById('pkgAcceptableInput').value = 'PASS';
      document.getElementById('hardFrozenInput').value = 'YES';
      document.getElementById('dataInput').value = sampleText;
      document.getElementById('notesInput').value = 'Kangaroo trim BBD: 30/06/2028\nKangaroo MDM BBD: 25/2/2029';
      parseData();
    }

    function clearData() {
      document.getElementById('deliveryNoInput').value = '';
      document.getElementById('supplierInput').value = '';
      document.getElementById('generatedByInput').value = '';
      document.getElementById('tempInput').value = '';
      document.getElementById('primesafeInput').value = '';
      document.getElementById('pkgAcceptableInput').value = 'PASS';
      document.getElementById('hardFrozenInput').value = 'YES';
      document.getElementById('dataInput').value = '';
      document.getElementById('notesInput').value = '';
      parseData();
    }

    function copyData() {
      const input = document.getElementById('dataInput').value;
      if (!input) return;
      navigator.clipboard.writeText(input);
      alert('Raw input copied to clipboard!');
    }

    async function sendEmail() {
      const btn = document.getElementById('uploadSharepointBtn');
      const deliveryNo = document.getElementById('deliveryNoInput')?.value.trim() || 'N/A';
      const supplier = document.getElementById('supplierInput')?.value.trim() || 'N/A';
      const generatedBy = document.getElementById('generatedByInput')?.value.trim() || 'N/A';
      const totalPallets = document.getElementById('statPallets')?.innerText || '0';
      const totalWeight = document.getElementById('statWeight')?.innerText || '0 kg';
      const notes = document.getElementById('notesInput')?.value.trim() || 'None';

      btn.innerText = '⏳ Generating PDF...';
      btn.disabled = true;

      try {
        const reportPages = document.querySelectorAll('.doc-page');
        if (!reportPages || reportPages.length === 0) {
          throw new Error('No report pages available to generate PDF.');
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();

        for (let i = 0; i < reportPages.length; i++) {
          const canvas = await html2canvas(reportPages[i], { scale: 1.5, useCORS: true });
          const imgData = canvas.toDataURL('image/jpeg', 0.9);
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

          if (i > 0) pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        }

        const pdfBlob = pdf.output('blob');
        const fileName = `Delivery_Docket_${deliveryNo}.pdf`;
        
        btn.innerText = '⏳ Uploading PDF...';

        const formData = new FormData();
        formData.append('UPLOADCARE_PUB_KEY', 'ffd51c8695aa14ed5f3d');
        formData.append('UPLOADCARE_STORE', '1');
        formData.append('file', pdfBlob, fileName);

        let pdfUrl = '';
        try {
          const uploadRes = await fetch('https://upload.uploadcare.com/base/', {
            method: 'POST',
            body: formData
          });
          const uploadData = await uploadRes.json();
          
          const fileUuid = uploadData.file || uploadData[fileName] || Object.values(uploadData)[0];
          if (fileUuid && typeof fileUuid === 'string') {
            const cleanUuid = fileUuid.replace('https://ucarecdn.com/', '').split('/')[0];
            pdfUrl = `https://ucarecdn.com/${cleanUuid}/${encodeURIComponent(fileName)}`;
          }
        } catch (uploadErr) {
          console.warn('Uploadcare request warning:', uploadErr);
        }

        if (!pdfUrl) {
          pdfUrl = URL.createObjectURL(pdfBlob);
        }

        btn.innerText = '⏳ Sending Email...';

        await emailjs.send(
          "service_z4pnmgz",     
          "template_b4u9035",    
          {
            delivery_no: deliveryNo,
            supplier: supplier,
            generated_by: generatedBy,
            total_pallets: totalPallets,
            total_weight: totalWeight,
            notes: notes,
            pdf_url: pdfUrl      
          },
          "I9OvU1KIHitB_S939"    
        );

        pdf.save(fileName);

        alert('✅ Email sent successfully & PDF downloaded locally!');
      } catch (err) {
        console.error('EmailJS / Upload Error:', err);
        alert(`❌ Process failed: ${err.text || err.message || JSON.stringify(err)}`);
      } finally {
        btn.innerText = '📧 Email Docket';
        btn.disabled = false;
      }
    }

    function extractWeightsFromLine(line) {
      const weights = [];
      const parts = line.split('-');
      parts.forEach(part => {
        const cleanPart = part.trim();
        const weightVal = parseFloat(cleanPart);
        if (!isNaN(weightVal) && weightVal > 0) {
          weights.push(weightVal);
        }
      });
      return weights;
    }

    function parseData() {
      const deliveryNo = document.getElementById('deliveryNoInput')?.value.trim() || '';
      const supplierVal = document.getElementById('supplierInput')?.value.trim() || '';
      const generatedByVal = document.getElementById('generatedByInput')?.value.trim() || '';
      const tempVal = document.getElementById('tempInput')?.value.trim() || '';
      const primesafeVal = document.getElementById('primesafeInput')?.value.trim() || '';
      const pkgAcceptableVal = document.getElementById('pkgAcceptableInput')?.value || 'PASS';
      const hardFrozenVal = document.getElementById('hardFrozenInput')?.value || 'YES';
      const rawText = document.getElementById('dataInput')?.value.trim() || '';
      const customNotes = document.getElementById('notesInput')?.value.trim() || '';
      const container = document.getElementById('reportContainer');
      const metrics = document.getElementById('dashboardMetrics');
      const badge = document.getElementById('palletCountBadge');

      if (!container || !metrics || !badge) return;

      if (!rawText) {
        metrics.style.display = 'none';
        badge.innerText = '0 Pallets';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            </div>
            <strong style="color:var(--text-main); display:block; font-size:17px;">Awaiting Input Data</strong>
            <p style="margin-top:8px; font-size:13px;">Enter product names and weights on the left, or click <strong>Sample</strong>.</p>
          </div>`;
        return;
      }

      const blocks = rawText.split(/\n\s*\n/);
      const products = [];
      let globalPalletIndex = 1;

      blocks.forEach(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length === 0) return;

        let prodName = lines[0].toUpperCase();
        let allWeights = [];

        for (let i = 1; i < lines.length; i++) {
          const wList = extractWeightsFromLine(lines[i]);
          allWeights = allWeights.concat(wList);
        }

        if (allWeights.length > 0) {
          const totalW = allWeights.reduce((acc, curr) => acc + curr, 0);
          const paletteItems = allWeights.map(w => ({
            palletNo: globalPalletIndex++,
            productName: prodName,
            weight: w
          }));

          const weightGroups = {};
          allWeights.forEach(w => {
            weightGroups[w] = (weightGroups[w] || 0) + 1;
          });

          const groupedSummary = Object.keys(weightGroups).map(wStr => {
            const wNum = parseFloat(wStr);
            const count = weightGroups[wStr];
            return { weight: wNum, count: count, total: wNum * count };
          });

          products.push({
            name: prodName,
            paletteItems: paletteItems,
            groupedSummary: groupedSummary,
            totalWeight: totalW,
            pallets: allWeights.length
          });
        }
      });

      if (products.length === 0) {
        metrics.style.display = 'none';
        badge.innerText = '0 Pallets';
        container.innerHTML = `
          <div class="empty-state">
            <strong style="color:var(--text-main); display:block; font-size:17px;">No Valid Weights Detected</strong>
            <p style="margin-top:8px; font-size:13px;">Ensure weights are separated by hyphens (e.g., 952-979.2).</p>
          </div>`;
        return;
      }

      let grandTotalPallets = 0;
      let grandTotalWeight = 0;
      products.forEach(p => {
        grandTotalPallets += p.pallets;
        grandTotalWeight += p.totalWeight;
      });

      metrics.style.display = 'grid';
      document.getElementById('statPallets').innerText = grandTotalPallets;
      document.getElementById('statWeight').innerText = formatNum(grandTotalWeight) + ' kg';
      document.getElementById('statProducts').innerText = products.length;
      badge.innerText = `${grandTotalPallets} Pallets`;

      const now = new Date();
      const timeStr = now.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase() + ' @ ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

      let html = `<div class="pdf-pages-wrapper">`;

      // ================= PAGE 1: DELIVERY BREAKDOWN =================
      html += `
        <div class="doc-page">
          <div>
            <div class="doc-header">
              <div class="header-col-left">
                <div>DELIVERY NO: ${deliveryNo || 'N/A'}</div>
                <div>SUPPLIER: ${supplierVal || 'N/A'}</div>
                <div>GENERATED BY: ${generatedByVal || 'N/A'}</div>
              </div>
              <div class="header-col-center">Delivery Breakdown</div>
              <div class="header-col-right">
                <div style="font-size:22px; font-weight:900; letter-spacing:-1px;">lyka</div>
                <div style="font-size:7.5px; font-weight:700; color:#4b5563;">GENERATED: ${timeStr}</div>
              </div>
            </div>

            <div class="meta-pills-stack">
              <div class="meta-pill"><span class="meta-pill-label">Temp on Arrival</span><span class="meta-pill-val">${tempVal || 'N/A'}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">PrimeSafe No.</span><span class="meta-pill-val">${primesafeVal || 'N/A'}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">Pkg Acceptable</span><span class="meta-pill-val ${pkgAcceptableVal.toLowerCase()}">${pkgAcceptableVal}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">Hard Frozen</span><span class="meta-pill-val ${hardFrozenVal.toLowerCase()}">${hardFrozenVal}</span></div>
            </div>

            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:12%;">Pallet No.</th>
                  <th style="width:46%;">Product Description</th>
                  <th style="width:14%;">Date</th>
                  <th style="width:14%;">Batch</th>
                  <th class="num-col" style="width:14%;">Weight (kg)</th>
                </tr>
              </thead>
              <tbody>`;

      products.forEach(p => {
        p.paletteItems.forEach(item => {
          html += `
            <tr>
              <td><strong>${item.palletNo}</strong></td>
              <td>${item.productName}</td>
              <td></td>
              <td></td>
              <td class="num-col"><strong>${formatNum(item.weight)}</strong></td>
            </tr>`;
        });
      });

      html += `
              </tbody>
            </table>
          </div>

          <div class="doc-footer-note">
            <span>Note: All weights are recorded in kilograms (kg).</span>
            <span>Generated on ${timeStr}</span>
          </div>
        </div>`;

      // ================= PAGE 2: DELIVERY SUMMARY =================
      html += `
        <div class="doc-page">
          <div>
            <div class="doc-header">
              <div class="header-col-left">
                <div>DELIVERY NO: ${deliveryNo || 'N/A'}</div>
                <div>SUPPLIER: ${supplierVal || 'N/A'}</div>
                <div>GENERATED BY: ${generatedByVal || 'N/A'}</div>
              </div>
              <div class="header-col-center">Delivery Summary</div>
              <div class="header-col-right">
                <div style="font-size:22px; font-weight:900; letter-spacing:-1px;">lyka</div>
                <div style="font-size:7.5px; font-weight:700; color:#4b5563;">GENERATED: ${timeStr}</div>
              </div>
            </div>

            <div class="meta-pills-stack">
              <div class="meta-pill"><span class="meta-pill-label">Temp on Arrival</span><span class="meta-pill-val">${tempVal || 'N/A'}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">PrimeSafe No.</span><span class="meta-pill-val">${primesafeVal || 'N/A'}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">Pkg Acceptable</span><span class="meta-pill-val ${pkgAcceptableVal.toLowerCase()}">${pkgAcceptableVal}</span></div>
              <div class="meta-pill"><span class="meta-pill-label">Hard Frozen</span><span class="meta-pill-val ${hardFrozenVal.toLowerCase()}">${hardFrozenVal}</span></div>
            </div>

            <div class="section-title">Pallet Quantity Breakdown by Weight</div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th class="num-col">Weight Per Pallet (kg)</th>
                  <th class="num-col">No. of Pallets</th>
                  <th class="num-col">Total Weight (kg)</th>
                </tr>
              </thead>
              <tbody>`;

      products.forEach(p => {
        p.groupedSummary.forEach((g, idx) => {
          html += `
            <tr>
              <td>${idx === 0 ? `<strong>${p.name}</strong>` : ''}</td>
              <td class="num-col">${formatNum(g.weight)}</td>
              <td class="num-col">${g.count}</td>
              <td class="num-col">${formatNum(g.total)}</td>
            </tr>`;
        });
        html += `
          <tr class="subtotal-row">
            <td>TOTAL ${p.name}</td>
            <td class="num-col">—</td>
            <td class="num-col">${p.pallets}</td>
            <td class="num-col">${formatNum(p.totalWeight)}</td>
          </tr>`;
      });

      html += `
                <tr class="grandtotal-row">
                  <td>GRAND TOTAL</td>
                  <td class="num-col">—</td>
                  <td class="num-col">${grandTotalPallets}</td>
                  <td class="num-col">${formatNum(grandTotalWeight)}</td>
                </tr>
              </tbody>
            </table>

            ${customNotes ? `
              <div class="custom-notes-box">
                <div class="custom-notes-title">Delivery Notes:</div>
                <div>${customNotes}</div>
              </div>
            ` : ''}

            <div class="sign-off-box">
              <div class="sign-off-title">Manager Approval & Sign-Off</div>
              <div class="sign-off-grid">
                <div>
                  <div class="sign-line"></div>
                  <div class="sign-label">Manager Name</div>
                </div>
                <div>
                  <div class="sign-line"></div>
                  <div class="sign-label">Signature</div>
                </div>
                <div>
                  <div class="sign-line"></div>
                  <div class="sign-label">Date</div>
                </div>
              </div>
            </div>
          </div>

          <div class="doc-footer-note">
            <span>Note: All weights are recorded in kilograms (kg).</span>
            <span>Generated on ${timeStr}</span>
          </div>
        </div>`;

      html += `</div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
