<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Breakdown Generator</title>
  <style>
    :root {
      --bg-dark: #0a0f0d;
      --card-bg: #111a15;
      --input-bg: #16241c;
      --accent-green: #00ff66;
      --border-green: #1f3d2b;
      --text-main: #ffffff;
      --text-muted: #88a090;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
    }

    .form-panel, .preview-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-green);
      border-radius: 12px;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: var(--accent-green);
      font-size: 1.1rem;
    }

    .action-btn {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--accent-green);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-green);
      border-radius: 6px;
      padding: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-green);
    }

    .delimiter-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1px solid var(--border-green);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .delimiter-box span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .delimiter-badge {
      background: #0d1711;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 2px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .preview-panel {
      background: #0d1410;
      display: flex;
      flex-direction: column;
    }

    .printable-sheet {
      background: #ffffff;
      color: #000000;
      padding: 30px;
      border-radius: 6px;
      min-height: 500px;
      font-family: Arial, sans-serif;
    }

    .printable-sheet h2 {
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .notes-display {
      margin-top: 20px;
      background: #f4f4f4;
      padding: 10px;
      border-left: 4px solid #000;
      white-space: pre-wrap;
      font-size: 0.85rem;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .printable-sheet, .printable-sheet * {
        visibility: visible;
      }
      .printable-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LEFT INPUT PANEL -->
  <div class="form-panel">
    <div class="top-bar">
      <div class="brand">
        <span>LYKA BREAKDOWN GENERATOR</span>
      </div>
      <button class="action-btn" onclick="window.print()">Print Docket (A4)</button>
    </div>

    <div class="section-title">
      <span>HEADER INFORMATION</span>
    </div>

    <div class="form-group grid-2">
      <div>
        <label>Delivery Ref No.</label>
        <input type="text" id="deliveryRef" value="TOLN___" oninput="updatePreview()">
      </div>
      <div>
        <label>Supplier Name</label>
        <input type="text" id="supplierName" placeholder="e.g. Parwan Valley" oninput="updatePreview()">
      </div>
    </div>

    <div class="form-group grid-2">
      <div>
        <label>Temp on Arrival</label>
        <input type="text" id="tempArrival" placeholder="e.g. -18°C" oninput="updatePreview()">
      </div>
      <div>
        <label>Primesafe No.</label>
        <input type="text" id="primesafeNo" placeholder="e.g. PS-10482" oninput="updatePreview()">
      </div>
    </div>

    <!-- PACKAGING ACCEPTABLE DROPDOWN -->
    <div class="form-group">
      <label>Packaging Acceptable</label>
      <select id="packagingAcceptable" onchange="updatePreview()">
        <option value="PASS">PASS</option>
        <option value="FAIL">FAIL</option>
      </select>
    </div>

    <!-- PRODUCT HARD FROZEN DROPDOWN (PLACED DIRECTLY BELOW) -->
    <div class="form-group">
      <label>Product Hard Frozen</label>
      <select id="productHardFrozen" onchange="updatePreview()">
        <option value="YES">YES</option>
        <option value="NO">NO</option>
      </select>
    </div>

    <div class="delimiter-box">
      <span>ACCEPTED DELIMITER:</span>
      <span class="delimiter-badge">-</span>
    </div>

    <div class="form-group">
      <label>Raw Breakdown Stream</label>
      <textarea id="rawStream" rows="6" placeholder="Kangaroo trim&#10;344-455-222-989&#10;&#10;Kangaroo MDM&#10;459-345-290" oninput="updatePreview()"></textarea>
    </div>

    <div class="form-group">
      <label>Additional Notes / Instructions</label>
      <textarea id="notes" rows="3" placeholder="Kangaroo trim BBD : 30/06/2028&#10;Kangaroo MDM BBD : 25/2/2029" oninput="updatePreview()"></textarea>
    </div>
  </div>

  <!-- RIGHT PREVIEW / PRINT PANEL -->
  <div class="preview-panel">
    <div class="printable-sheet" id="printSheet">
      <h2>RECEIVING DOCKET SUMMARY</h2>
      
      <div class="meta-grid">
        <div><strong>Delivery Ref:</strong> <span id="outRef">TOLN___</span></div>
        <div><strong>Supplier:</strong> <span id="outSupplier">-</span></div>
        <div><strong>Temp on Arrival:</strong> <span id="outTemp">-</span></div>
        <div><strong>Primesafe No:</strong> <span id="outPrimesafe">-</span></div>
        <div><strong>Packaging Acceptable:</strong> <span id="outPkg">PASS</span></div>
        <div><strong>Product Hard Frozen:</strong> <span id="outFrozen">YES</span></div>
      </div>

      <hr style="margin: 15px 0;">

      <div>
        <strong>Breakdown Data:</strong>
        <pre id="outStream" style="margin-top: 10px; font-family: monospace; white-space: pre-wrap;"></pre>
      </div>

      <div class="notes-display" id="outNotesContainer">
        <strong>Notes / BBD Details:</strong>
        <div id="outNotes"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function updatePreview() {
    document.getElementById('outRef').textContent = document.getElementById('deliveryRef').value || '-';
    document.getElementById('outSupplier').textContent = document.getElementById('supplierName').value || '-';
    document.getElementById('outTemp').textContent = document.getElementById('tempArrival').value || '-';
    document.getElementById('outPrimesafe').textContent = document.getElementById('primesafeNo').value || '-';
    document.getElementById('outPkg').textContent = document.getElementById('packagingAcceptable').value;
    document.getElementById('outFrozen').textContent = document.getElementById('productHardFrozen').value;
    document.getElementById('outStream').textContent = document.getElementById('rawStream').value || 'Awaiting Input Data...';
    document.getElementById('outNotes').textContent = document.getElementById('notes').value || 'None';
  }

  // Initial call on page load
  updatePreview();
</script>

</body>
</html>
