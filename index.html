<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Breakdown Generator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Libraries for PDF & Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- EmailJS Browser SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b140d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      background-color: #111f15;
      border-bottom: 1px solid #1e3a24;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      color: #00ff66;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background-color: #00ff66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b140d;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timestamp-badge {
      background-color: #08110a;
      border: 1px solid #1e3a24;
      color: #00ff66;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background-color: #1a2e20;
      color: #e0e0e0;
      border: 1px solid #2a4c33;
    }

    .btn-secondary:hover {
      background-color: #24422e;
    }

    .btn-primary {
      background-color: #00ff66;
      color: #0b140d;
      font-weight: 700;
    }

    .btn-primary:hover {
      background-color: #00cc52;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Main App Layout */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Control Panel */
    .left-panel {
      width: 380px;
      background-color: #0e1a11;
      border-right: 1px solid #1e3a24;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e3a24;
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #88a08e;
    }

    .quick-links {
      display: flex;
      gap: 8px;
    }

    .link-btn {
      background: none;
      border: none;
      color: #00ff66;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #88a08e;
    }

    .form-control {
      background-color: #08110a;
      border: 1px solid #1e3a24;
      border-radius: 6px;
      padding: 10px;
      color: #ffffff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-control:focus {
      border-color: #00ff66;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .badge-select {
      display: inline-block;
      padding: 4px 10px;
      background-color: #00ff66;
      color: #0b140d;
      font-weight: 800;
      border-radius: 4px;
      font-size: 0.75rem;
      width: fit-content;
    }

    /* Right Preview Panel */
    .right-panel {
      flex: 1;
      background-color: #070d08;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Dashboard Metrics Cards */
    .dashboard-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .metric-card {
      background-color: #111f15;
      border: 1px solid #1e3a24;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .metric-icon {
      width: 36px;
      height: 36px;
      background-color: rgba(0, 255, 102, 0.1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .metric-data {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      color: #88a08e;
    }

    .metric-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* Rendered PDF Page Styling (A4 Ratio) */
    .report-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .doc-page {
      background-color: #ffffff;
      color: #111111;
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #111111;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .doc-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .doc-meta {
      font-size: 0.75rem;
      line-height: 1.4;
    }

    .doc-meta strong {
      font-weight: 700;
    }

    .brand-logo-text {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -1px;
    }

    /* Acceptance Table */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid #dddddd;
      background-color: #f9f9f9;
      margin-bottom: 15px;
      font-size: 0.7rem;
    }

    .summary-cell {
      padding: 6px 10px;
      border-right: 1px solid #dddddd;
    }

    .summary-cell:last-child {
      border-right: none;
    }

    .summary-cell-title {
      color: #666666;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.6rem;
    }

    .summary-cell-value {
      font-weight: 800;
      font-size: 0.85rem;
      margin-top: 2px;
    }

    /* Breakdown Table */
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      margin-bottom: 15px;
    }

    .breakdown-table th {
      background-color: #111111;
      color: #ffffff;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 8px;
      text-align: left;
      font-size: 0.65rem;
    }

    .breakdown-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #eeeeee;
    }

    .breakdown-table tr:nth-child(even) td {
      background-color: #fcfcfc;
    }

    .breakdown-table .grand-total-row td {
      background-color: #111111;
      color: #00ff66;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 8px;
    }

    .doc-footer {
      border-top: 1px solid #dddddd;
      padding-top: 8px;
      font-size: 0.65rem;
      color: #777777;
      display: flex;
      justify-content: space-between;
    }

    /* PRINT STYLES: Hides dark UI and outputs clean document pages */
    @media print {
      header, 
      .left-panel, 
      .dashboard-metrics, 
      .quick-links {
        display: none !important;
      }

      body, 
      .app-body, 
      .right-panel, 
      .report-container {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        overflow: visible !important;
        display: block !important;
      }

      .doc-page {
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        page-break-after: always;
      }

      .breakdown-table tr {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- Header / Navigation Bar -->
  <header>
    <div class="brand">
      <div class="brand-icon">✓</div>
      <span>LYKA BREAKDOWN GENERATOR</span>
    </div>
    <div class="header-actions">
      <div class="timestamp-badge" id="liveTimestamp">19 Sept 2026 - 09:35:04 PM</div>
      <button class="btn btn-secondary" onclick="copyInputText()">📋 Copy Input</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-primary" id="uploadSharepointBtn" onclick="sendTestEmail()">📧 Email Docket</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Configuration Panel -->
    <div class="left-panel">
      <div class="panel-header">
        <span class="panel-title">Header Information</span>
        <div class="quick-links">
          <button class="link-btn" onclick="loadSampleData()">Sample</button>
          <button class="link-btn" onclick="clearForm()">Clear</button>
        </div>
      </div>

      <div class="form-group">
        <label>Delivery Ref No.</label>
        <input type="text" id="deliveryNoInput" class="form-control" value="TOLN10492" oninput="renderDocket()">
      </div>

      <div class="form-group">
        <label>Supplier Name</label>
        <input type="text" id="supplierInput" class="form-control" value="PARWAN VALLEY MEATS" oninput="renderDocket()">
      </div>

      <div class="form-group">
        <label>Generated By (Your Name)</label>
        <input type="text" id="generatedByInput" class="form-control" value="JOHN DOE" oninput="renderDocket()">
      </div>

      <div class="form-group">
        <label>Temp On Arrival</label>
        <input type="text" id="tempInput" class="form-control" value="-18°C" oninput="renderDocket()">
      </div>

      <div class="form-group">
        <label>Premise Gate No.</label>
        <input type="text" id="premiseInput" class="form-control" value="PS-10462" oninput="renderDocket()">
      </div>

      <div class="form-group">
        <label>Packaging Acceptable</label>
        <div class="badge-select">PASS</div>
      </div>

      <div class="form-group">
        <label>Product Hard Frozen</label>
        <select id="hardFrozenInput" class="form-control" onchange="renderDocket()">
          <option value="YES" selected>YES</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div class="panel-header" style="margin-top: 10px;">
        <span class="panel-title">Raw Breakdown Stream</span>
      </div>

      <div class="form-group">
        <textarea id="rawBreakdownInput" class="form-control" rows="8" oninput="renderDocket()">Kangaroo trim
952-979.2-979.2-979.2-979.2-939.2

Kangaroo MDM
432-432-612-612-720-720-720</textarea>
      </div>

      <div class="form-group">
        <label>Additional Notes / Instructions</label>
        <textarea id="notesInput" class="form-control" rows="3" oninput="renderDocket()">Kangaroo Trim BBD: 30/06/2028
Kangaroo MDM BBD: 25/02/2027</textarea>
      </div>
    </div>

    <!-- Right Interactive Preview Panel -->
    <div class="right-panel">
      <!-- Live Dashboard Counters -->
      <div class="dashboard-metrics" id="dashboardMetrics">
        <div class="metric-card">
          <div class="metric-icon">📦</div>
          <div class="metric-data">
            <span class="metric-label">Total Pallets</span>
            <span class="metric-value" id="statPallets">13</span>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon">⚖️</div>
          <div class="metric-data">
            <span class="metric-label">Total Weight</span>
            <span class="metric-value" id="statWeight">11,795.2 kg</span>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon">🏷️</div>
          <div class="metric-data">
            <span class="metric-label">Unique Products</span>
            <span class="metric-value" id="statProducts">2</span>
          </div>
        </div>
      </div>

      <!-- Rendered Document View -->
      <div class="report-container" id="reportContainer">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // System Clock Updates
    function updateClock() {
      const now = new Date();
      const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('liveTimestamp').innerText = now.toLocaleString('en-GB', options).replace(',', ' -');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Docket Renderer Logic
    function renderDocket() {
      const deliveryNo = document.getElementById('deliveryNoInput').value || 'N/A';
      const supplier = document.getElementById('supplierInput').value || 'N/A';
      const generatedBy = document.getElementById('generatedByInput').value || 'N/A';
      const temp = document.getElementById('tempInput').value || 'N/A';
      const premise = document.getElementById('premiseInput').value || 'N/A';
      const hardFrozen = document.getElementById('hardFrozenInput').value;
      const rawText = document.getElementById('rawBreakdownInput').value;
      const notesText = document.getElementById('notesInput').value;

      const lines = rawText.split('\n');
      let currentProduct = '';
      let rows = [];
      let totalWeight = 0;
      let palletIndex = 1;
      let uniqueProducts = new Set();

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        if (trimmed.includes('-')) {
          const weights = trimmed.split('-');
          weights.forEach(w => {
            const val = parseFloat(w);
            if (!isNaN(val)) {
              rows.push({
                palletNo: palletIndex++,
                product: currentProduct || 'UNSPECIFIED PRODUCT',
                date: '30/06/2026',
                batch: '26200211',
                weight: val
              });
              totalWeight += val;
              if (currentProduct) uniqueProducts.add(currentProduct);
            }
          });
        } else {
          currentProduct = trimmed.toUpperCase();
        }
      });

      // Update Dashboard Metrics
      document.getElementById('statPallets').innerText = rows.length;
      document.getElementById('statWeight').innerText = totalWeight.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kg';
      document.getElementById('statProducts').innerText = uniqueProducts.size;

      // Build HTML Report
      const container = document.getElementById('reportContainer');
      container.innerHTML = `
        <div class="doc-page">
          <div>
            <div class="doc-header">
              <div class="doc-meta">
                <div><strong>DELIVERY NO:</strong> ${deliveryNo}</div>
                <div><strong>SUPPLIER:</strong> ${supplier}</div>
                <div><strong>GENERATED BY:</strong> ${generatedBy}</div>
              </div>
              <div style="text-align: center;">
                <div class="doc-title">DELIVERY BREAKDOWN</div>
              </div>
              <div style="text-align: right;">
                <div class="brand-logo-text">lyka</div>
                <div style="font-size: 0.6rem; color: #666;">GENERATED: ${new Date().toLocaleDateString('en-GB')}</div>
              </div>
            </div>

            <div class="summary-grid">
              <div class="summary-cell">
                <div class="summary-cell-title">TEMP ON ARRIVAL</div>
                <div class="summary-cell-value">${temp}</div>
              </div>
              <div class="summary-cell">
                <div class="summary-cell-title">PREMISE GATE NO.</div>
                <div class="summary-cell-value">${premise}</div>
              </div>
              <div class="summary-cell">
                <div class="summary-cell-title">PACKAGING ACCEPTABLE</div>
                <div class="summary-cell-value" style="color: green;">PASS</div>
              </div>
            </div>

            <table class="breakdown-table">
              <thead>
                <tr>
                  <th style="width: 10%;">PALLET NO.</th>
                  <th style="width: 45%;">PRODUCT DESCRIPTION</th>
                  <th style="width: 15%;">DATE</th>
                  <th style="width: 15%;">BATCH</th>
                  <th style="width: 15%; text-align: right;">WEIGHT (KG)</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td>${r.palletNo}</td>
                    <td><strong>${r.product}</strong></td>
                    <td>${r.date}</td>
                    <td>${r.batch}</td>
                    <td style="text-align: right; font-weight: 700;">${r.weight.toFixed(1)}</td>
                  </tr>
                `).join('')}
                <tr class="grand-total-row">
                  <td colspan="4" style="text-align: right;">GRAND TOTAL</td>
                  <td style="text-align: right;">${totalWeight.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} kg</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div>
            ${notesText ? `<div style="font-size: 0.65rem; color: #444; margin-bottom: 10px;"><strong>NOTES:</strong> ${notesText.replace(/\n/g, '<br>')}</div>` : ''}
            <div class="doc-footer">
              <span>Lyka Logistics & Stock Receiving Docket</span>
              <span>Page 1 of 1</span>
            </div>
          </div>
        </div>
      `;
    }

    // Email Dispatcher Logic (Corrected EmailJS Key)
    async function sendTestEmail() {
      const btn = document.getElementById('uploadSharepointBtn');
      const pages = document.querySelectorAll('.doc-page');

      if (pages.length === 0) {
        alert('Please generate a docket first.');
        return;
      }

      btn.innerText = '📧 Sending Email...';
      btn.disabled = true;

      try {
        const deliveryNo = document.getElementById('deliveryNoInput').value || 'N/A';
        const supplier = document.getElementById('supplierInput').value || 'N/A';
        const generatedBy = document.getElementById('generatedByInput').value || 'N/A';
        const totalPallets = document.getElementById('statPallets').innerText || '0';
        const totalWeight = document.getElementById('statWeight').innerText || '0 kg';
        const notes = document.getElementById('notesInput').value || 'None';

        // Corrected Public Key: Capital "I" instead of lowercase "l"
        await emailjs.send(
          "service_z4pnmgz",     // Service ID
          "template_b4u9035",    // Template ID
          {
            delivery_no: deliveryNo,
            supplier: supplier,
            generated_by: generatedBy,
            total_pallets: totalPallets,
            total_weight: totalWeight,
            notes: notes
          },
          "I9OvU1KlHitB_S939"    // Public Key (Capital I)
        );

        alert('✅ Test Email sent successfully!');
      } catch (err) {
        console.error('EmailJS Error Details:', err);
        alert(`❌ Email failed: ${err.text || err.message || JSON.stringify(err)}`);
      } finally {
        btn.innerText = '📧 Email Docket';
        btn.disabled = false;
      }
    }

    // Helper functions
    function copyInputText() {
      const rawText = document.getElementById('rawBreakdownInput').value;
      navigator.clipboard.writeText(rawText);
      alert('📋 Raw breakdown text copied to clipboard!');
    }

    function loadSampleData() {
      document.getElementById('deliveryNoInput').value = 'TOLN10492';
      document.getElementById('supplierInput').value = 'PARWAN VALLEY MEATS';
      document.getElementById('generatedByInput').value = 'JOHN DOE';
      document.getElementById('tempInput').value = '-18°C';
      document.getElementById('premiseInput').value = 'PS-10462';
      document.getElementById('rawBreakdownInput').value = "Kangaroo trim\n952-979.2-979.2-979.2-979.2-939.2\n\nKangaroo MDM\n432-432-612-612-720-720-720";
      document.getElementById('notesInput').value = "Kangaroo Trim BBD: 30/06/2028\nKangaroo MDM BBD: 25/02/2027";
      renderDocket();
    }

    function clearForm() {
      document.getElementById('deliveryNoInput').value = '';
      document.getElementById('supplierInput').value = '';
      document.getElementById('generatedByInput').value = '';
      document.getElementById('tempInput').value = '';
      document.getElementById('premiseInput').value = '';
      document.getElementById('rawBreakdownInput').value = '';
      document.getElementById('notesInput').value = '';
      renderDocket();
    }

    // Initial render call
    renderDocket();
  </script>
</body>
</html>
