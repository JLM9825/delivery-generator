<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyka Delivery Breakdown Generator</title>
  <style>
    /* --- LYKA APP INTERFACE THEME --- */
    :root {
      --lyka-dark: #0a1c17;
      --lyka-panel: #112822;
      --lyka-card-bg: #16332b;
      --lyka-green: #056839;
      --lyka-accent: #25d366;
      --lyka-border: #1f473c;
      --lyka-text: #e8f5e9;
      --lyka-text-muted: #a3c2b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background-color: var(--lyka-dark); color: var(--lyka-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--lyka-panel); border-bottom: 2px solid var(--lyka-green); }
    header h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    
    .btn { padding: 9px 18px; font-size: 13px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: var(--lyka-accent); color: #052317; }
    .btn-primary:hover { background-color: #20bd5a; }
    .btn-secondary { background: var(--lyka-card-bg); color: var(--lyka-text); border: 1px solid var(--lyka-border); margin-left: 8px; }

    /* Layout */
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .left-panel { width: 420px; background: var(--lyka-panel); border-right: 1px solid var(--lyka-border); padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .right-panel { flex: 1; background: var(--lyka-dark); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

    .panel-title { font-size: 12px; font-weight: 700; color: var(--lyka-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .format-box { background: var(--lyka-card-bg); border: 1px solid var(--lyka-border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; color: var(--lyka-text-muted); line-height: 1.5; }
    
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; font-weight: 700; color: var(--lyka-text-muted); text-transform: uppercase; }
    .input-text { background: var(--lyka-dark); border: 1px solid var(--lyka-border); border-radius: 6px; color: #6ee7b7; font-size: 13px; padding: 10px; outline: none; }
    .input-text:focus { border-color: var(--lyka-accent); }

    textarea { width: 100%; height: 260px; background: var(--lyka-dark); border: 1px solid var(--lyka-border); border-radius: 6px; color: #6ee7b7; font-family: monospace; font-size: 13px; padding: 12px; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--lyka-accent); }

    /* --- PRINTABLE REPORT / DOCKET DOCUMENT STYLES --- */
    .report-paper { background: #ffffff; color: #111827; width: 100%; max-width: 800px; padding: 24px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 11px; }

    .doc-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--lyka-green); padding-bottom: 8px; margin-bottom: 16px; }
    .delivery-no-box { font-size: 12px; font-weight: 800; color: var(--lyka-green); text-transform: uppercase; }
    .doc-title h2 { font-size: 20px; font-weight: 900; color: var(--lyka-green); letter-spacing: 0.5px; text-align: center; }
    .doc-logo { font-size: 24px; font-weight: 900; color: var(--lyka-green); font-style: italic; letter-spacing: -1px; text-align: right; }

    .summary-section {
      margin-top: 24px;
      page-break-inside: avoid;
    }

    .section-title { font-size: 13px; font-weight: 800; color: var(--lyka-green); text-transform: uppercase; margin: 16px 0 6px 0; border-bottom: 1px solid var(--lyka-green); padding-bottom: 2px; }

    /* Tables */
    table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; page-break-inside: auto; }
    table.data-table tr { page-break-inside: avoid; page-break-after: auto; }
    table.data-table th, table.data-table td { border: 1px solid #d1d5db; padding: 4px 8px; text-align: left; }
    table.data-table th { background: #f0fdf4; color: var(--lyka-green); font-weight: 800; text-transform: uppercase; }
    table.data-table .num-col { text-align: right; }
    
    .subtotal-row { background-color: #f8fafc; font-weight: bold; color: var(--lyka-green); }
    .grandtotal-row { background-color: var(--lyka-green); color: #ffffff; font-weight: 900; font-size: 11px; }
    .grandtotal-row td { border-color: var(--lyka-green); }

    .doc-note { font-size: 10px; color: #6b7280; font-style: italic; margin-top: 12px; }

    /* Empty State */
    .empty-state { color: var(--lyka-text-muted); text-align: center; margin-top: 100px; font-size: 14px; }

    /* --- CSS PRINT MEDIA --- */
    @media print {
      header, .left-panel, .no-print { display: none !important; }
      body, .app-body, .right-panel { background: #ffffff !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; display: block !important; }
      .report-paper { box-shadow: none !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
      .data-table th { background-color: #f0fdf4 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .grandtotal-row { background-color: #056839 !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 LYKA DELIVERY BREAKDOWN GENERATOR</h1>
    <div>
      <button class="btn btn-primary" onclick="window.print()">🖨️ PRINT DOCKET (A4)</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Input Panel -->
    <div class="left-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="panel-title">INPUT PALLET DATA</span>
        <div>
          <button class="btn btn-secondary" onclick="loadSample()">Example</button>
          <button class="btn btn-secondary" onclick="clearData()">Clear</button>
        </div>
      </div>

      <!-- Delivery Number Input -->
      <div class="field-group">
        <label class="field-label" for="deliveryNoInput">Delivery No.</label>
        <input type="text" id="deliveryNoInput" class="input-text" placeholder="e.g. DEL-88492" oninput="parseData()">
      </div>

      <div class="format-box">
        <strong>Format:</strong><br>
        [Product Description]<br>
        [Weights separated by spaces or commas]<br><br>
        <em>Example:</em><br>
        Beef heart<br>
        864 864 864 816 900<br><br>
        Beef lungs<br>
        540 540 480 504
      </div>

      <textarea id="dataInput" placeholder="Paste product name and weights..." oninput="parseData()"></textarea>
    </div>

    <!-- Right Live Preview -->
    <div class="right-panel">
      <div id="reportContainer" style="width: 100%; display: flex; justify-content: center;">
        <div class="empty-state">
          <p>📋 No pallet breakdown generated yet.</p>
          <p style="font-size:12px; margin-top:6px;">Paste warehouse data or click <strong>Example</strong>.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleText = `Goat carcass
520 600 720 580 625 700 720 720 720 720 720 720 480 240 520 325

Goat heart
875 520 540 360 300

Goat trim
979.2 979.2 788.8 707.2 816 979.2

Goat liver
600 240 200 580 1000

Goat lung
520 600`;

    function loadSample() {
      document.getElementById('deliveryNoInput').value = 'DEL-10492';
      document.getElementById('dataInput').value = sampleText;
      parseData();
    }

    function clearData() {
      document.getElementById('deliveryNoInput').value = '';
      document.getElementById('dataInput').value = '';
      parseData();
    }

    function parseData() {
      const deliveryNo = document.getElementById('deliveryNoInput').value.trim();
      const rawText = document.getElementById('dataInput').value.trim();
      const container = document.getElementById('reportContainer');

      if (!rawText) {
        container.innerHTML = `
          <div class="empty-state">
            <p>📋 No pallet breakdown generated yet.</p>
            <p style="font-size:12px; margin-top:6px;">Paste warehouse data or click <strong>Example</strong>.</p>
          </div>`;
        return;
      }

      const pallets = [];
      let palletCounter = 1;

      // Group text by product sections (split by non-numeric headings)
      const sectionRegex = /([a-zA-Z][a-zA-Z\s\-_]*)([\d\s,.\t\n\r]+)/g;
      let match;

      while ((match = sectionRegex.exec(rawText)) !== null) {
        const prodName = match[1].trim().toUpperCase();
        const weightsChunk = match[2];

        // Extract every single numeric weight in this block
        const weightMatches = weightsChunk.match(/\b\d+(?:\.\d+)?\b/g);
        if (weightMatches) {
          weightMatches.forEach(numStr => {
            const w = parseFloat(numStr);
            if (!isNaN(w) && w > 0) {
              pallets.push({
                palletNo: palletCounter++,
                desc: prodName,
                weight: w
              });
            }
          });
        }
      }

      if (pallets.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>⚠️ No valid product weights found.</p>
          </div>`;
        return;
      }

      // --- CALCULATE SUMMARY GROUPS ---
      const summaryGroups = {};
      let totalPalletsCount = 0;
      let grandTotalWeight = 0;

      pallets.forEach(item => {
        totalPalletsCount++;
        grandTotalWeight += item.weight;

        if (!summaryGroups[item.desc]) {
          summaryGroups[item.desc] = { weights: {}, totalWeight: 0, totalPallets: 0 };
        }

        const group = summaryGroups[item.desc];
        const wKey = item.weight.toString();
        
        if (!group.weights[wKey]) {
          group.weights[wKey] = 0;
        }
        group.weights[wKey]++;
        group.totalPallets++;
        group.totalWeight += item.weight;
      });

      // Build HTML
      let html = `
        <div class="report-paper">
          <!-- Page Header -->
          <div class="doc-header">
            <div class="delivery-no-box" style="width:30%;">
              ${deliveryNo ? `DELIVERY NO: ${deliveryNo}` : ''}
            </div>
            <div class="doc-title" style="width:40%;">
              <h2>DELIVERY BREAKDOWN</h2>
            </div>
            <div class="doc-logo" style="width:30%;">lyka</div>
          </div>

          <!-- Itemized Pallet Breakdown Table -->
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 15%;">PALLET NO.</th>
                <th style="width: 60%;">PRODUCT DESCRIPTION</th>
                <th style="width: 25%;" class="num-col">WEIGHT (KG)</th>
              </tr>
            </thead>
            <tbody>
              ${pallets.map(p => `
                <tr>
                  <td>${p.palletNo}</td>
                  <td><strong>${p.desc}</strong></td>
                  <td class="num-col"><strong>${p.weight.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <!-- Continuous Delivery Summary -->
          <div class="summary-section">
            <div class="section-title">DELIVERY SUMMARY</div>
            <div style="font-weight: bold; font-size: 10.5px; margin-bottom: 6px; color: #374151;">PALLET QUANTITY BREAKDOWN BY WEIGHT</div>

            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 40%;">PRODUCT</th>
                  <th style="width: 20%;" class="num-col">WEIGHT PER PALLET (KG)</th>
                  <th style="width: 20%;" class="num-col">NO. OF PALLETS</th>
                  <th style="width: 20%;" class="num-col">TOTAL WEIGHT (KG)</th>
                </tr>
              </thead>
              <tbody>
      `;

      Object.keys(summaryGroups).forEach(prodName => {
        const group = summaryGroups[prodName];
        const weightsList = Object.keys(group.weights);

        weightsList.forEach((wVal, idx) => {
          const count = group.weights[wVal];
          const subWeight = parseFloat(wVal) * count;
          
          html += `
            <tr>
              <td>${idx === 0 ? `<strong>${prodName}</strong>` : ''}</td>
              <td class="num-col">${parseFloat(wVal).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</td>
              <td class="num-col">${count}</td>
              <td class="num-col">${subWeight.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</td>
            </tr>
          `;
        });

        // Group Total Row
        html += `
          <tr class="subtotal-row">
            <td>TOTAL ${prodName}</td>
            <td class="num-col"></td>
            <td class="num-col">${group.totalPallets}</td>
            <td class="num-col">${group.totalWeight.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</td>
          </tr>
        `;
      });

      // Grand Total Row
      html += `
              <tr class="grandtotal-row">
                <td>GRAND TOTAL</td>
                <td class="num-col"></td>
                <td class="num-col">${totalPalletsCount}</td>
                <td class="num-col">${grandTotalWeight.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</td>
              </tr>
            </tbody>
          </table>

          <div class="doc-note">
            Note: All weights are in kilograms (kg).
          </div>
        </div>
      </div>
      `;

      container.innerHTML = html;
    }
  </script>
</body>
</html>
